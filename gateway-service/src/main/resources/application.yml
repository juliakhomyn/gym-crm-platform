spring:
  application:
    name: api-gateway-service
  cloud:
    gateway:
      routes:
        - id: gym-core-service
          uri: lb://gym-core-service
          predicates:
            - Path=/gym-crm/core/**
        - id: workload-service
          uri: lb://workload-service
          predicates:
            - Path=/gym-crm/workload/**

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics"
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}