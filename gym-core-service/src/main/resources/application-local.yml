spring:
  datasource:
    url: jdbc:mysql://localhost:3306/gym_db
    username: gymuser
    password: gympass
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    root: INFO
    org.springframework: INFO
    com.gym.crm: DEBUG