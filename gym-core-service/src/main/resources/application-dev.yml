spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    org.springframework: INFO
    com.gym.crm: DEBUG

eureka:
  client:
    service-url:
      defaultZone: ${DISCOVERY_SERVICE_URL}
  instance:
    prefer-ip-address: true

app:
  services:
    workload:
      url: ${WORKLOAD_SERVICE_URL}