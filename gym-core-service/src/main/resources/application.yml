spring:
  application:
    name: gym-core-service
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  liquibase:
    changelog: classpath:db/migration/master.xml
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  jms:
    queue:
      trainer-workload: trainer.workload.queue
    request-timeout-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

server:
  port: 8082
  servlet:
    context-path: /gym-crm/core

app:
  api:
    base-path: /api/v1
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  services:
    workload:
      url: ${WORKLOAD_SERVICE_URL}
      connect-timeout-ms: 3000
      read-timeout-ms: 5000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

eureka:
  client:
    registerWithEureka: true
    fetchRegistry: true

resilience4j:
  circuitbreaker:
    instances:
      workloadService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s