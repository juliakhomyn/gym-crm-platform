spring:
  application:
    name: workload-service
  jms:
    trainer-workload:
      queue: trainer.workload.queue
      concurrency: "3-10"
      dlq: trainer.workload.dlq
    redelivery:
      initial-delay-ms: 1000
      maximum-redeliveries: 3
      maximum-delay-ms: 10000
      back-off-multiplier: 2.0
      use-exponential-back-off: true

server:
  port: 8081
  servlet:
    context-path: /gym-crm/workload

app:
  api:
    base-path: /api/v1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

jwt:
  secret: ${JWT_SECRET}