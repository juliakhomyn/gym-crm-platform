spring:
  application:
    name: workload-service

server:
  port: 8081
  servlet:
    context-path: /gym-crm/workload

app:
  api:
    base-path: /api/v1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true